- title: Autonomous Mobile Robotics and Drones for Construction Quality and Progress Monitoring
  partners: With the University of British Columbia and industry partners
  description: Developing drones and robotics for data-driven quality assurance in inaccessible or confined construction environments, using AI-based photogrammetry and BIM-based as-built comparison.

- title: Cloud-Based AI for Satellite, GIS, and Remote Sensing Data Analysis
  partners: With the University of Ottawa
  description: Cloud-based AI tools for analyzing satellite imagery, GIS, and remote sensing data, enabling rapid detection of environmental changes, infrastructure conditions, and hazards across large areas.

- title: Wildfire Detection and Infrastructure Monitoring in Canada's Wildland-Urban Interface
  description: UAVs, advanced remote sensing, and cloud-based AI for real-time wildfire detection and monitoring, supporting emergency response and mitigation.

- title: Robotics and Automation for Construction
  description: Pilot projects implementing painting robots, robotic arms, and automated systems to improve construction speed, quality, and worker safety.

- title: AI and Data Analysis for Enhanced Productivity
  description: AI for layout optimization in modular construction, large language models for document and contract analysis, and thermal imagery analysis for early anomaly detection.

- title: Thermal Imaging and Anomaly Detection Across Sectors
  description: Thermal imaging and analytics to detect anomalies in energy, transportation, and construction, supporting predictive maintenance and quality assurance.
